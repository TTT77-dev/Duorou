<title>板栗种植基地</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7a8c6e;
    --sage-light: #a8b89a;
    --sage-pale: #e8ede4;
    --sage-dark: #4a5c3e;
    --terracotta: #c4714a;
    --terracotta-light: #e8a882;
    --cream: #f5f0e8;
    --warm-white: #faf8f4;
    --text-dark: #2c2c2a;
    --text-mid: #6b6860;
    --text-light: #a09e9a;
    --shadow: rgba(74,92,62,0.15);
    --shadow-strong: rgba(74,92,62,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Noto Serif SC', serif; background: var(--warm-white); color: var(--text-dark); min-height: 100vh; overscroll-behavior: none; }

  .app-header { background: var(--sage-dark); color: var(--cream); padding: 52px 20px 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px var(--shadow-strong); }
  .app-header h1 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; letter-spacing: 2px; }

  .tabs { display: flex; background: var(--sage-dark); padding: 0 10px 12px; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { flex-shrink: 0; padding: 8px 12px; border: 1.5px solid rgba(255,255,255,0.25); border-radius: 20px; background: transparent; color: rgba(255,255,255,0.6); font-family: 'Noto Serif SC', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .tab-btn.active { background: var(--terracotta); border-color: var(--terracotta); color: white; font-weight: 600; }

  .tray-section { padding: 16px; display: none; }
  .tray-section.active { display: block; }

  .tray-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .tray-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--sage-dark); font-style: italic; }
  .tray-stats { font-size: 11px; color: var(--text-light); letter-spacing: 1px; }

  .tray-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 20px; border: none; font-family: 'Noto Serif SC', serif; font-size: 13px; cursor: pointer; transition: all 0.18s; font-weight: 600; }
  .btn-water { background: var(--sage); color: white; box-shadow: 0 2px 8px var(--shadow); }
  .btn-water:active { transform: scale(0.96); background: var(--sage-dark); }
  .btn-sort { background: var(--cream); color: var(--sage-dark); border: 1.5px solid var(--sage-light); }
  .btn-sort:active { background: var(--sage-pale); }
  .sort-active { background: var(--sage-pale) !important; border-color: var(--sage) !important; }
  .drag-mode-btn { background: var(--cream); color: var(--sage-dark); border: 1.5px solid var(--sage-light); font-size: 12px; }
  .drag-mode-btn.active-drag { background: var(--terracotta); color: white; border-color: var(--terracotta); }

  .succulent-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .cell { aspect-ratio: 1; border-radius: 10px; overflow: hidden; position: relative; background: var(--sage-pale); border: 1.5px solid transparent; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .cell:active { transform: scale(0.94); }
  .cell.occupied { border-color: var(--sage-light); }
  .cell.empty { border: 1.5px dashed var(--sage-light); background: transparent; cursor: default; }
  .cell.drag-over { border-color: var(--terracotta) !important; box-shadow: 0 0 0 2px var(--terracotta-light); }
  .cell.dragging { opacity: 0.4; }
  .cell-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell-no-photo { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--sage-light); font-family: 'Playfair Display', serif; font-weight: 600; }
  .cell-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(44,44,42,0.72)); padding: 4px 4px 3px; }
  .cell-name { color: white; font-size: 9px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

  .detail-view { display: none; position: fixed; inset: 0; background: var(--warm-white); z-index: 200; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .detail-actions { padding: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-photo { background: var(--terracotta); color: white; }

  .btn-album { background: var(--cream); color: var(--sage-dark); border: 1.5px solid var(--sage-light); }
  .btn-rename { background: var(--cream); color: var(--sage-dark); border: 1.5px solid var(--sage-light); }
  .btn-water-detail { background: var(--sage); color: white; }

  .detail-body { padding: 0 16px 40px; }
  .section-label { font-size: 11px; color: var(--text-light); letter-spacing: 2px; text-transform: uppercase; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--sage-pale); }

  .water-log-list { display: flex; flex-direction: column; gap: 8px; }
  .water-log-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--sage-pale); border-radius: 10px; }
  .water-log-left { display: flex; align-items: center; gap: 10px; }
  .water-log-icon { font-size: 16px; }
  .water-log-date { font-size: 13px; color: var(--text-mid); }
  .water-log-del { font-size: 12px; color: #b04040; cursor: pointer; padding: 2px 8px; }
  .water-log-empty { font-size: 13px; color: var(--text-light); font-style: italic; padding: 10px 0; }

  .photo-log-list { display: flex; flex-direction: column; gap: 16px; }
  .photo-log-item { border-radius: 12px; overflow: hidden; background: var(--cream); }
  .photo-log-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .photo-log-meta { padding: 8px 12px 10px; display: flex; justify-content: space-between; align-items: center; }
  .photo-log-date { font-size: 12px; color: var(--text-mid); }
  .photo-log-del { font-size: 12px; color: #b04040; cursor: pointer; padding: 2px 6px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--warm-white); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 480px; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--sage-dark); margin-bottom: 16px; font-style: italic; }
  .modal-input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--sage-light); border-radius: 12px; font-family: 'Noto Serif SC', serif; font-size: 15px; background: var(--cream); color: var(--text-dark); outline: none; margin-bottom: 14px; }
  .modal-input:focus { border-color: var(--sage); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-confirm { flex: 1; padding: 12px; background: var(--sage-dark); color: white; border: none; border-radius: 12px; font-family: 'Noto Serif SC', serif; font-size: 15px; font-weight: 600; cursor: pointer; }
  .modal-cancel { padding: 12px 20px; background: var(--cream); color: var(--text-mid); border: 1.5px solid var(--sage-light); border-radius: 12px; font-family: 'Noto Serif SC', serif; font-size: 15px; cursor: pointer; }
  .confirm-modal .modal-confirm { background: #b04040; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--sage-dark); color: white; padding: 10px 22px; border-radius: 20px; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #cameraInput, #albumInput { display: none; }
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div class="app-header">
  <h1>🌰 板栗种植基地</h1>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTray(0)">透明</button>
  <button class="tab-btn" onclick="switchTray(1)">中</button>
  <button class="tab-btn" onclick="switchTray(2)">白</button>
  <button class="tab-btn" onclick="switchTray(3)">方盆</button>
  <button class="tab-btn" onclick="switchTray(4)">其他</button>
</div>

<div id="tray-0" class="tray-section active"></div>
<div id="tray-1" class="tray-section"></div>
<div id="tray-2" class="tray-section"></div>
<div id="tray-3" class="tray-section"></div>
<div id="tray-4" class="tray-section"></div>

<!-- DETAIL VIEW -->
<div class="detail-view" id="detailView">
  <div class="detail-header">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <div class="detail-name-wrap">
      <div class="detail-plant-name" id="detail-name">—</div>

    <button class="btn btn-photo" onclick="triggerCamera()">📷 拍照</button>
    <button class="btn btn-album" onclick="triggerAlbum()">🖼 相册</button>
    <button class="btn btn-water-detail" onclick="waterSingle()">💧 浇水</button>
    <button class="btn btn-rename" onclick="openRenameModal()">✏️ 改名</button>
    <button class="btn btn-remove" onclick="openRemoveConfirm()">移除</button>
  </div>
  <div class="detail-body">
    <div class="section-label">浇水记录</div>
    <div class="water-log-list" id="water-log-list"></div>
    <div class="section-label">生长照片</div>
    <div class="photo-log-list" id="photo-log-list"></div>
  </div>
</div>

<!-- RENAME MODAL -->
<div class="modal-overlay" id="renameModal">
  <div class="modal-box">
    <div class="modal-title" id="rename-title">修改名字</div>
    <input class="modal-input" id="renameInput" type="text" placeholder="输入名字…" maxlength="20">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal('renameModal')">取消</button>
      <button class="modal-confirm" onclick="confirmRename()">确认</button>

</div>

<!-- REMOVE CONFIRM -->
<div class="modal-overlay confirm-modal" id="removeModal">
  <div class="modal-box">
    <div class="modal-title">确认移除？</div>
    <p style="font-size:14px;color:var(--text-mid);margin-bottom:18px;">这盆多肉的所有照片和记录都会删除，格子变为空位。</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal('removeModal')">取消</button>
      <button class="modal-confirm" onclick="confirmRemove()">确认移除</button>
    </div>
  </div>
</div>

<!-- WATER ALL CONFIRM -->
<div class="modal-overlay" id="waterAllModal">
  <div class="modal-box">
    <div class="modal-title" id="waterAllTitle">一键浇水</div>
    <p style="font-size:14px;color:var(--text-mid);margin-bottom:18px;" id="waterAllDesc"></p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal('waterAllModal')">取消</button>
      <button class="modal-confirm" onclick="confirmWaterAll()">💧 确认浇水</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="cameraInput" accept="image/*" capture="environment">
<input type="file" id="albumInput" accept="image/*">

<script>
const TRAY_NAMES = ['透明', '中', '白', '方盆', '其他'];
const GRID_SIZE = 40;

let db, plants = {}, currentTray = 0;
let sortByWater = [false,false,false,false,false];
let dragModeActive = [false,false,false,false,false];
let dragSrcId = null;
let detailPlantId = null;
let pendingWaterAllTray = null;

// ── DB ──
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('duorou_db', 2);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('plants')) d.createObjectStore('plants', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('photos')) {
        const ps = d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
        ps.createIndex('plantId', 'plantId', { unique: false });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = rej;
  });
}
const dbGet = (store, key) => new Promise((res,rej) => { const r = db.transaction(store).objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=rej; });
const dbPut = (store, val) => new Promise((res,rej) => { const r = db.transaction(store,'readwrite').objectStore(store).put(val); r.onsuccess=()=>res(r.result); r.onerror=rej; });
const dbDelete = (store, key) => new Promise((res,rej) => { const r = db.transaction(store,'readwrite').objectStore(store).delete(key); r.onsuccess=()=>res(); r.onerror=rej; });
const dbGetAll = (store) => new Promise((res,rej) => { const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=rej; });
const dbGetByIndex = (store, idx, key) => new Promise((res,rej) => { const r = db.transaction(store).objectStore(store).index(idx).getAll(key); r.onsuccess=()=>res(r.result); r.onerror=rej; });
function dbDeleteByIndex(store, idx, key) {
  return new Promise((res,rej) => {
    const t = db.transaction(store,'readwrite');
    t.objectStore(store).index(idx).openCursor(IDBKeyRange.only(key)).onsuccess = e => {
      const c = e.target.result; if(c){c.delete();c.continue();}
    };
    t.oncomplete=()=>res(); t.onerror=rej;
  });
}

// ── INIT ──
async function init() {
  await openDB();
  const all = await dbGetAll('plants');
  all.forEach(p => plants[p.id] = p);
  await seed();
  buildTrayHTML();
  renderAll();
}

async function seed() {
  for (let t = 0; t < 5; t++) {
    for (let s = 0; s < GRID_SIZE; s++) {
      const id = t+'_'+s;
      if (!plants[id]) {
        const p = { id, trayIdx: t, slot: s, name: defaultName(t,s), waterLog: [], latestPhotoId: null };
        plants[id] = p;
        await dbPut('plants', p);
      }
    }
  }
}

function defaultName(t, s) {
  return TRAY_NAMES[t] + '-' + (s+1);
}

// ── BUILD TRAY HTML ──
function buildTrayHTML() {
  for (let t = 0; t < 5; t++) {
    document.getElementById('tray-'+t).innerHTML = `
      <div class="tray-meta">
        <div class="tray-title">${TRAY_NAMES[t]}盆</div>
        <div class="tray-stats" id="stats-${t}"></div>
      </div>
      <div class="tray-actions">
        <button class="btn btn-water" onclick="waterAll(${t})">💧 一键浇水</button>
        <button class="btn btn-sort" id="sort-btn-${t}" onclick="toggleSort(${t})">🕐 按浇水排序</button>
        <button class="btn drag-mode-btn" id="drag-btn-${t}" onclick="toggleDragMode(${t})">↕ 移动</button>
      </div>
      <div class="succulent-grid" id="grid-${t}"></div>
    `;
  }
}

// ── RENDER ──
function renderAll() { for(let t=0;t<5;t++) renderTray(t); }

async function renderTray(tIdx) {
  const grid = document.getElementById('grid-'+tIdx);
  const statsEl = document.getElementById('stats-'+tIdx);
  if (!grid) return;

  let tp = Object.values(plants).filter(p => p.trayIdx === tIdx);
  let slots;
  if (sortByWater[tIdx]) {
    const occ = tp.filter(p=>p.name!==null).sort((a,b)=>{
      const aw = a.waterLog.length ? a.waterLog[a.waterLog.length-1] : 0;
      const bw = b.waterLog.length ? b.waterLog[b.waterLog.length-1] : 0;
      return aw - bw;
    });
    slots = [...occ, ...tp.filter(p=>p.name===null)];
  } else {
    slots = tp.sort((a,b)=>a.slot-b.slot);
  }

  const alive = tp.filter(p=>p.name!==null).length;
  statsEl.textContent = alive+' / '+GRID_SIZE+' 盆';
  grid.innerHTML = '';
  for (const plant of slots) grid.appendChild(await buildCell(plant, tIdx));
}

async function buildCell(plant, tIdx) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.plantId = plant.id;

  if (plant.name === null) {
    cell.classList.add('empty');
    const plus = document.createElement('div');
    plus.className = 'cell-empty-plus';
    plus.textContent = '+';
    cell.appendChild(plus);
    cell.addEventListener('click', () => openAddPlant(plant.id));
    return cell;
  }

  cell.classList.add('occupied');
  if (plant.latestPhotoId) {
    try {
      const photo = await dbGet('photos', plant.latestPhotoId);
      if (photo) { const img=document.createElement('img'); img.className='cell-photo'; img.src=photo.dataUrl; cell.appendChild(img); }
      else addPlaceholder(cell, plant.slot);
    } catch { addPlaceholder(cell, plant.slot); }
  } else { addPlaceholder(cell, plant.slot); }

  const overlay = document.createElement('div'); overlay.className='cell-overlay';
  const nameEl = document.createElement('div'); nameEl.className='cell-name'; nameEl.textContent=plant.name;
  overlay.appendChild(nameEl); cell.appendChild(overlay);

  const badge = document.createElement('div'); badge.className='cell-water-badge'; badge.textContent='💧';
  badge.addEventListener('click', async e => {
    e.stopPropagation();
    const result = await recordWater(plant.id);
    showToast(result === 'already' ? '今天已经浇过水了' : '💧 '+plant.name+' 已浇水');
  });
  cell.appendChild(badge);

  cell.addEventListener('click', () => { if(!dragModeActive[tIdx]) openDetail(plant.id); });
  setupDrag(cell, plant.id, tIdx);
  return cell;
}

function addPlaceholder(cell, slot) {
  const ph=document.createElement('div'); ph.className='cell-no-photo'; ph.textContent=slot+1; cell.appendChild(ph);
}

// ── DRAG ──
function setupDrag(cell, plantId, tIdx) {
  cell.addEventListener('touchstart', e => {
    if (!dragModeActive[tIdx]) return;
    dragSrcId = plantId; cell.classList.add('dragging');
  }, { passive: true });
  cell.addEventListener('touchmove', e => {
    if (!dragModeActive[tIdx]||!dragSrcId) return;
    e.preventDefault();
    document.querySelectorAll('.drag-over').forEach(c=>c.classList.remove('drag-over'));
    const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    const tc = el?.closest('.cell');
    if (tc && tc!==cell) tc.classList.add('drag-over');
  }, { passive: false });
  cell.addEventListener('touchend', async e => {
    if (!dragModeActive[tIdx]||!dragSrcId) return;
    cell.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(c=>c.classList.remove('drag-over'));
    const el = document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    const tc = el?.closest('.cell');
    if (tc && tc.dataset.plantId && tc.dataset.plantId!==dragSrcId) await swapPlants(dragSrcId, tc.dataset.plantId);
    dragSrcId = null;
  });
}

async function swapPlants(idA, idB) {
  const a=plants[idA], b=plants[idB]; if(!a||!b) return;
  const ts=a.slot, tt=a.trayIdx;
  a.slot=b.slot; a.trayIdx=b.trayIdx; b.slot=ts; b.trayIdx=tt;
  await dbPut('plants',a); await dbPut('plants',b);
  renderTray(a.trayIdx); if(a.trayIdx!==b.trayIdx) renderTray(b.trayIdx);
  showToast('位置已互换');
}

function toggleDragMode(tIdx) {
  dragModeActive[tIdx]=!dragModeActive[tIdx];
  const btn=document.getElementById('drag-btn-'+tIdx);
  const grid=document.getElementById('grid-'+tIdx);
  if(dragModeActive[tIdx]){ btn.classList.add('active-drag'); btn.textContent='✓ 完成'; grid.classList.add('drag-mode'); showToast('拖动格子换位置'); }
  else { btn.classList.remove('active-drag'); btn.textContent='↕ 移动'; grid.classList.remove('drag-mode'); }
}

function toggleSort(tIdx) {
  sortByWater[tIdx]=!sortByWater[tIdx];
  const btn=document.getElementById('sort-btn-'+tIdx);
  if(sortByWater[tIdx]){ btn.classList.add('sort-active'); btn.textContent='🔢 自定义排序'; }
  else { btn.classList.remove('sort-active'); btn.textContent='🕐 按浇水排序'; }
  renderTray(tIdx);
}

// ── TABS ──
function switchTray(idx) {
  currentTray=idx;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.tray-section').forEach((s,i)=>s.classList.toggle('active',i===idx));
}

// ── WATER ──
function todayStr() {
  const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

async function recordWater(plantId) {
  const p=plants[plantId]; if(!p) return;
  const today=todayStr();
  const alreadyToday = p.waterLog.some(ts => {
    const d=new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()===today;
  });
  if (alreadyToday) return 'already';
  p.waterLog.push(Date.now());
  await dbPut('plants',p);
  renderTray(p.trayIdx);
  return 'ok';
}

function waterAll(tIdx) {
  pendingWaterAllTray=tIdx;
  document.getElementById('waterAllTitle').textContent=TRAY_NAMES[tIdx]+'盆 一键浇水';
  const alive=Object.values(plants).filter(p=>p.trayIdx===tIdx&&p.name!==null).length;
  document.getElementById('waterAllDesc').textContent='将为'+TRAY_NAMES[tIdx]+'盆全部 '+alive+' 盆多肉记录今天的浇水时间（每天只记录一次）。';
  openModal('waterAllModal');
}

async function confirmWaterAll() {
  closeModal('waterAllModal');
  const tIdx=pendingWaterAllTray, now=Date.now(), today=todayStr();
  const tp=Object.values(plants).filter(p=>p.trayIdx===tIdx&&p.name!==null);
  let count=0;
  for (const p of tp) {
    const alreadyToday=p.waterLog.some(ts=>{const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()===today;});
    if(!alreadyToday){ p.waterLog.push(now); await dbPut('plants',p); count++; }
  }
  renderTray(tIdx);
  showToast('💧 '+TRAY_NAMES[tIdx]+'盆 '+count+' 盆已浇水');
}

function waterSingle() {
  if(!detailPlantId) return;
  recordWater(detailPlantId).then(result=>{
    if(result==='already') showToast('今天已经浇过水了');
    else { renderDetailWaterLog(); showToast('💧 已记录浇水'); }
  });
}

// ── DETAIL ──
function openDetail(plantId) {
  detailPlantId=plantId;
  const p=plants[plantId];
  document.getElementById('detail-name').textContent=p.name;
  document.getElementById('detail-pos').textContent=TRAY_NAMES[p.trayIdx]+'盆 · 第'+(p.slot+1)+'位';
  document.getElementById('detailView').classList.add('open');
  renderDetailWaterLog(); renderDetailPhotos();
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('open');
  detailPlantId=null;
}

function renderDetailWaterLog() {
  const p=plants[detailPlantId], el=document.getElementById('water-log-list');
  if(!p||!p.waterLog.length){ el.innerHTML='<div class="water-log-empty">还没有浇水记录</div>'; return; }
  const sorted=[...p.waterLog].sort((a,b)=>b-a);
  el.innerHTML=sorted.map((ts,i)=>`
    <div class="water-log-item">
      <div class="water-log-left"><span class="water-log-icon">💧</span><span class="water-log-date">${formatDay(ts)}</span></div>
      <span class="water-log-del" onclick="deleteWaterLog(${ts})">删除</span>
    </div>
  `).join('');
}

async function deleteWaterLog(ts) {
  const p=plants[detailPlantId]; if(!p) return;
  p.waterLog=p.waterLog.filter(t=>t!==ts);
  await dbPut('plants',p);
  renderDetailWaterLog(); renderTray(p.trayIdx);
  showToast('浇水记录已删除');
}

async function renderDetailPhotos() {
  const el=document.getElementById('photo-log-list');
  el.innerHTML='<div class="photo-log-empty">加载中…</div>';
  const photos=await dbGetByIndex('photos','plantId',detailPlantId);
  photos.sort((a,b)=>b.timestamp-a.timestamp);
  if(!photos.length){ el.innerHTML='<div class="photo-log-empty">还没有照片，点击上方📷拍照吧</div>'; return; }
  el.innerHTML=photos.map(ph=>`
    <div class="photo-log-item">
      <img class="photo-log-img" src="${ph.dataUrl}" loading="lazy">
      <div class="photo-log-meta">
        <span class="photo-log-date">${formatDay(ph.timestamp)}</span>
        <span class="photo-log-del" onclick="deletePhoto(${ph.id})">删除</span>
      </div>
    </div>
  `).join('');
}

async function deletePhoto(photoId) {
  const photo=await dbGet('photos',photoId); if(!photo) return;
  await dbDelete('photos',photoId);
  const p=plants[photo.plantId];
  if(p&&p.latestPhotoId===photoId){
    const rem=await dbGetByIndex('photos','plantId',photo.plantId);
    rem.sort((a,b)=>b.timestamp-a.timestamp);
    p.latestPhotoId=rem.length?rem[0].id:null;
    await dbPut('plants',p); renderTray(p.trayIdx);
  }
  renderDetailPhotos(); showToast('照片已删除');
}

// ── CAMERA ──
function triggerCamera() { document.getElementById('cameraInput').click(); }
function triggerAlbum() { document.getElementById('albumInput').click(); }

async function handleImageFile(file) {
  if(!file||!detailPlantId) return;
  const dataUrl=await compressImage(file);
  const photoId=await dbPut('photos',{ plantId:detailPlantId, dataUrl, timestamp:Date.now() });
  const p=plants[detailPlantId]; p.latestPhotoId=photoId;
  await dbPut('plants',p);
  renderTray(p.trayIdx); renderDetailPhotos();
  showToast('📷 照片已保存');
}

document.getElementById('cameraInput').addEventListener('change', e=>{ handleImageFile(e.target.files[0]); e.target.value=''; });
document.getElementById('albumInput').addEventListener('change', e=>{ handleImageFile(e.target.files[0]); e.target.value=''; });

function compressImage(file) {
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1200;
        let w=img.width, h=img.height;
        if(w>h){ if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} } else { if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.90));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── RENAME / ADD ──
function openAddPlant(plantId) {
  detailPlantId=plantId;
  document.getElementById('rename-title').textContent='添加多肉名字';
  document.getElementById('renameInput').value='';
  openModal('renameModal');
  setTimeout(()=>document.getElementById('renameInput').focus(),300);
}

function openRenameModal() {
  document.getElementById('rename-title').textContent='修改名字';
  document.getElementById('renameInput').value=plants[detailPlantId]?.name||'';
  openModal('renameModal');
  setTimeout(()=>document.getElementById('renameInput').focus(),300);
}

async function confirmRename() {
  const val=document.getElementById('renameInput').value.trim(); if(!val) return;
  const p=plants[detailPlantId]; p.name=val;
  await dbPut('plants',p);
  document.getElementById('detail-name').textContent=val;
  renderTray(p.trayIdx); closeModal('renameModal');
  showToast('名字已更新');
}

// ── REMOVE ──
function openRemoveConfirm() { openModal('removeModal'); }
async function confirmRemove() {
  closeModal('removeModal');
  const p=plants[detailPlantId];
  await dbDeleteByIndex('photos','plantId',detailPlantId);
  p.name=null; p.waterLog=[]; p.latestPhotoId=null;
  await dbPut('plants',p); renderTray(p.trayIdx); closeDetail();
  showToast('多肉已移除');
}

// ── MODALS ──
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) closeModal(o.id); }));

// ── TOAST ──
let toastTimer;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

// ── UTILS ──
function formatDay(ts){ const d=new Date(ts); return d.getFullYear()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getDate().toString().padStart(2,'0'); }

document.getElementById('renameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') confirmRename(); });

init();
</script>
