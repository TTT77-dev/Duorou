<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="板栗种植基地">
<title>板栗种植基地</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7a8c6e;
    --sage-light: #a8b89a;
    --sage-pale: #e8ede4;
    --sage-dark: #4a5c3e;
    --terracotta: #c4714a;
    --terracotta-light: #e8a882;
    --cream: #f5f0e8;
    --warm-white: #faf8f4;
    --text-dark: #2c2c2a;
    --text-mid: #6b6860;
    --text-light: #a09e9a;
    --shadow: rgba(74, 92, 62, 0.15);
    --shadow-strong: rgba(74, 92, 62, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--warm-white);
    color: var(--text-dark);
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--sage-dark);
    color: var(--cream);
    padding: 52px 20px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px var(--shadow-strong);
  }
  .app-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .app-header .subtitle {
    font-size: 11px;
    opacity: 0.65;
    margin-top: 2px;
    letter-spacing: 3px;
    font-weight: 300;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: var(--sage-dark);
    padding: 0 16px 12px;
    gap: 8px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 4px;
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--terracotta);
    border-color: var(--terracotta);
    color: white;
    font-weight: 600;
  }

  /* ── TRAY SECTION ── */
  .tray-section {
    padding: 16px;
    display: none;
  }
  .tray-section.active { display: block; }

  .tray-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tray-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--sage-dark);
    font-style: italic;
  }
  .tray-stats {
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 1px;
  }

  .tray-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 20px;
    border: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.18s;
    font-weight: 600;
  }
  .btn-water {
    background: var(--sage);
    color: white;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .btn-water:active { transform: scale(0.96); background: var(--sage-dark); }

  .btn-sort {
    background: var(--cream);
    color: var(--sage-dark);
    border: 1.5px solid var(--sage-light);
  }
  .btn-sort:active { background: var(--sage-pale); }

  .sort-active { background: var(--sage-pale) !important; border-color: var(--sage) !important; }

  /* ── GRID ── */
  .succulent-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .cell {
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    background: var(--sage-pale);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .cell:active { transform: scale(0.94); }
  .cell.occupied { border-color: var(--sage-light); }
  .cell.empty { border: 1.5px dashed var(--sage-light); background: transparent; cursor: default; }
  .cell.drag-over { border-color: var(--terracotta) !important; box-shadow: 0 0 0 2px var(--terracotta-light); }
  .cell.dragging { opacity: 0.4; }

  .cell-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cell-no-photo {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .cell-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(44,44,42,0.72));
    padding: 4px 4px 3px;
  }
  .cell-name {
    color: white;
    font-size: 9px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .cell-water-badge {
    position: absolute;
    top: 3px; right: 3px;
    width: 16px; height: 16px;
    background: var(--sage);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    transition: transform 0.15s;
  }
  .cell-water-badge:active { transform: scale(1.2); background: var(--sage-dark); }
  .cell-empty-plus {
    font-size: 20px;
    color: var(--sage-light);
    opacity: 0.5;
  }

  /* ── DETAIL VIEW ── */
  .detail-view {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--warm-white);
    z-index: 200;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .detail-view.open { display: block; }

  .detail-header {
    background: var(--sage-dark);
    padding: 52px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .detail-name-wrap { flex: 1; }
  .detail-plant-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: white;
    font-style: italic;
  }
  .detail-plant-pos {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
    letter-spacing: 1px;
  }

  .detail-actions {
    padding: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-photo {
    background: var(--terracotta);
    color: white;
    box-shadow: 0 2px 8px rgba(196,113,74,0.35);
  }
  .btn-photo:active { transform: scale(0.96); background: #a85a38; }
  .btn-rename {
    background: var(--cream);
    color: var(--sage-dark);
    border: 1.5px solid var(--sage-light);
  }
  .btn-water-detail {
    background: var(--sage);
    color: white;
  }
  .btn-remove {
    background: var(--cream);
    color: #b04040;
    border: 1.5px solid #e0b0b0;
    margin-left: auto;
  }

  .detail-body { padding: 0 16px 40px; }

  .section-label {
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 20px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--sage-pale);
  }

  /* water log */
  .water-log-list { display: flex; flex-direction: column; gap: 8px; }
  .water-log-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--sage-pale);
    border-radius: 10px;
  }
  .water-log-icon { font-size: 16px; }
  .water-log-date { font-size: 13px; color: var(--text-mid); }
  .water-log-empty { font-size: 13px; color: var(--text-light); font-style: italic; padding: 10px 0; }

  /* photo log */
  .photo-log-list { display: flex; flex-direction: column; gap: 16px; }
  .photo-log-item { border-radius: 12px; overflow: hidden; background: var(--cream); }
  .photo-log-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .photo-log-meta {
    padding: 8px 12px 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .photo-log-date { font-size: 12px; color: var(--text-mid); }
  .photo-log-del { font-size: 12px; color: #b04040; cursor: pointer; padding: 2px 6px; }
  .photo-log-empty { font-size: 13px; color: var(--text-light); font-style: italic; padding: 10px 0; }

  /* ── MODALS ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--warm-white);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--sage-dark);
    margin-bottom: 16px;
    font-style: italic;
  }
  .modal-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--sage-light);
    border-radius: 12px;
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    background: var(--cream);
    color: var(--text-dark);
    outline: none;
    margin-bottom: 14px;
  }
  .modal-input:focus { border-color: var(--sage); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-confirm {
    flex: 1;
    padding: 12px;
    background: var(--sage-dark);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-cancel {
    padding: 12px 20px;
    background: var(--cream);
    color: var(--text-mid);
    border: 1.5px solid var(--sage-light);
    border-radius: 12px;
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    cursor: pointer;
  }

  /* toast */
  .toast {
    position: fixed;
    bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--sage-dark);
    color: white;
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* hidden file input */
  #cameraInput { display: none; }

  /* drag handle indicator */
  .drag-mode .cell.occupied {
    animation: wiggle 0.4s ease infinite alternate;
  }
  @keyframes wiggle {
    from { transform: rotate(-1deg); }
    to { transform: rotate(1deg); }
  }
  .drag-mode-btn {
    background: var(--cream);
    color: var(--sage-dark);
    border: 1.5px solid var(--sage-light);
    font-size: 12px;
  }
  .drag-mode-btn.active-drag {
    background: var(--terracotta);
    color: white;
    border-color: var(--terracotta);
  }

  /* confirm dialog for destructive actions */
  .confirm-modal .modal-confirm { background: #b04040; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div class="app-header">

<!-- TRAY 0: 透明 -->

  </div>
  <div class="tray-actions">
    <button class="btn btn-water" onclick="waterAll(1)">💧 一键浇水</button>

<div class="tray-section" id="tray-2">

<!-- DETAIL VIEW -->

    <button class="btn btn-photo" onclick="triggerCamera()">📷 拍照记录</button>

  <div class="detail-body">
    <div class="section-label">浇水记录</div>

    <div class="section-label">生长照片</div>

<!-- RENAME MODAL -->

<script>
// ────────────────────────────────────────────
// DB
// ────────────────────────────────────────────
const DB_NAME = 'duorou_db';
const DB_VER = 1;
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('plants')) {
        d.createObjectStore('plants', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('photos')) {
        const ps = d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
        ps.createIndex('plantId', 'plantId', { unique: false });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}

function tx(store, mode) {
  return db.transaction(store, mode).objectStore(store);
}

function dbGet(store, key) {
  return new Promise((res, rej) => {
    const r = tx(store, 'readonly').get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = rej;
  });
}

function dbPut(store, val) {
  return new Promise((res, rej) => {
    const r = tx(store, 'readwrite').put(val);
    r.onsuccess = () => res(r.result);
    r.onerror = rej;
  });
}

function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const r = tx(store, 'readwrite').delete(key);
    r.onsuccess = () => res();
    r.onerror = rej;
  });
}

function dbGetAll(store) {
  return new Promise((res, rej) => {
    const r = tx(store, 'readonly').getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = rej;
  });
}

function dbGetByIndex(store, index, key) {
  return new Promise((res, rej) => {
    const r = tx(store, 'readonly').index(index).getAll(key);
    r.onsuccess = () => res(r.result);
    r.onerror = rej;
  });
}

function dbDeleteByIndex(store, index, key) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, 'readwrite');
    const s = t.objectStore(store).index(index);
    const r = s.openCursor(IDBKeyRange.only(key));
    r.onsuccess = e => {
      const c = e.target.result;
      if (c) { c.delete(); c.continue(); }
    };
    t.oncomplete = () => res();
    t.onerror = rej;
  });
}

// ────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────
const TRAY_NAMES = ['透明', '中', '白'];
const GRID_SIZE = 40; // 5×8

let plants = {}; // id -> plant obj
// plant: { id, trayIdx, slot, name, waterLog: [timestamp], latestPhotoId }
let currentTray = 0;
let sortByWater = [false, false, false];
let dragModeActive = [false, false, false];
let dragSrcId = null;

let detailPlantId = null;
let pendingWaterAllTray = null;

// ────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────
async function init() {
  await openDB();
  const all = await dbGetAll('plants');
  all.forEach(p => { plants[p.id] = p; });
  await seedIfEmpty();
  renderAll();
}

async function seedIfEmpty() {
  // Check if we have any plants
  if (Object.keys(plants).length === 0) {
    // Seed 40 slots per tray
    for (let t = 0; t < 3; t++) {
      for (let s = 0; s < GRID_SIZE; s++) {
        const id = `${t}_${s}`;
        const p = {
          id,
          trayIdx: t,
          slot: s,
          name: defaultName(t, s),
          waterLog: [],
          latestPhotoId: null
        };
        plants[id] = p;
        await dbPut('plants', p);
      }
    }
  }
}

function defaultName(trayIdx, slot) {
  if (trayIdx === 0) return `透-${slot + 1}`;
  if (trayIdx === 1) return `中-${slot + 1}`;
  return `白-${slot + 1}`;
}

// ────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────
function renderAll() {
  for (let t = 0; t < 3; t++) renderTray(t);
}

async function renderTray(tIdx) {
  const grid = document.getElementById(`grid-${tIdx}`);
  const statsEl = document.getElementById(`stats-${tIdx}`);

  // Get plants for this tray, sorted by slot
  let trayPlants = Object.values(plants).filter(p => p.trayIdx === tIdx);

  let slots;
  if (sortByWater[tIdx]) {
    // Sort occupied slots by last water date (oldest first = needs water most)
    const occupied = trayPlants.filter(p => p.name !== null);
    const empty = trayPlants.filter(p => p.name === null);
    occupied.sort((a, b) => {
      const aw = a.waterLog.length ? a.waterLog[a.waterLog.length - 1] : 0;
      const bw = b.waterLog.length ? b.waterLog[b.waterLog.length - 1] : 0;
      return aw - bw;
    });
    slots = [...occupied, ...empty];
  } else {
    trayPlants.sort((a, b) => a.slot - b.slot);
    slots = trayPlants;
  }

  // Count alive
  const alive = trayPlants.filter(p => p.name !== null).length;
  statsEl.textContent = `${alive} / ${GRID_SIZE} 盆`;

  grid.innerHTML = '';
  for (const plant of slots) {
    const cell = await buildCell(plant, tIdx);
    grid.appendChild(cell);
  }
}

async function buildCell(plant, tIdx) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.plantId = plant.id;

  const isEmpty = plant.name === null;

  if (isEmpty) {
    cell.classList.add('empty');
    const plus = document.createElement('div');
    plus.className = 'cell-empty-plus';
    plus.textContent = '+';
    cell.appendChild(plus);
    // click empty = add plant
    cell.addEventListener('click', () => openAddPlant(plant.id));
    return cell;
  }

  cell.classList.add('occupied');

  // Photo
  if (plant.latestPhotoId) {
    try {
      const photo = await dbGet('photos', plant.latestPhotoId);
      if (photo) {
        const img = document.createElement('img');
        img.className = 'cell-photo';
        img.src = photo.dataUrl;
        cell.appendChild(img);
      } else {
        addPlaceholder(cell);
      }
    } catch { addPlaceholder(cell); }
  } else {
    addPlaceholder(cell);
  }

  // Name overlay
  const overlay = document.createElement('div');
  overlay.className = 'cell-overlay';
  const nameEl = document.createElement('div');
  nameEl.className = 'cell-name';
  nameEl.textContent = plant.name;
  overlay.appendChild(nameEl);
  cell.appendChild(overlay);

  // Water badge
  const badge = document.createElement('div');
  badge.className = 'cell-water-badge';
  badge.textContent = '💧';
  badge.title = '单独浇水';
  badge.addEventListener('click', async (e) => {
    e.stopPropagation();
    await recordWater(plant.id);
    showToast(`💧 ${plant.name} 已浇水`);
  });
  cell.appendChild(badge);

  // Click -> detail
  cell.addEventListener('click', (e) => {
    if (dragModeActive[tIdx]) return;
    openDetail(plant.id);
  });

  // Drag
  setupDrag(cell, plant.id, tIdx);

  return cell;
}

function addPlaceholder(cell) {
  const ph = document.createElement('div');
  ph.className = 'cell-no-photo';
  ph.textContent = '🌵';
  cell.appendChild(ph);
}

// ────────────────────────────────────────────
// DRAG & DROP
// ────────────────────────────────────────────
function setupDrag(cell, plantId, tIdx) {
  // Touch drag
  let touchStartX, touchStartY, touchDragging = false, ghost = null;

  cell.addEventListener('touchstart', (e) => {
    if (!dragModeActive[tIdx]) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    dragSrcId = plantId;
    cell.classList.add('dragging');
  }, { passive: true });

  cell.addEventListener('touchmove', (e) => {
    if (!dragModeActive[tIdx] || !dragSrcId) return;
    e.preventDefault();
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    document.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
    const targetCell = el?.closest('.cell');
    if (targetCell && targetCell !== cell) targetCell.classList.add('drag-over');
  }, { passive: false });

  cell.addEventListener('touchend', async (e) => {
    if (!dragModeActive[tIdx] || !dragSrcId) return;
    cell.classList.remove('dragging');
    const touch = e.changedTouches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    document.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
    const targetCell = el?.closest('.cell');
    if (targetCell && targetCell.dataset.plantId && targetCell.dataset.plantId !== dragSrcId) {
      await swapPlants(dragSrcId, targetCell.dataset.plantId);
    }
    dragSrcId = null;
  });
}

async function swapPlants(idA, idB) {
  const a = plants[idA];
  const b = plants[idB];
  if (!a || !b) return;
  // Swap slot and tray
  const tmpSlot = a.slot, tmpTray = a.trayIdx;
  a.slot = b.slot; a.trayIdx = b.trayIdx;
  b.slot = tmpSlot; b.trayIdx = tmpTray;
  await dbPut('plants', a);
  await dbPut('plants', b);
  renderTray(a.trayIdx);
  if (a.trayIdx !== b.trayIdx) renderTray(b.trayIdx);
  showToast('位置已互换');
}

// ────────────────────────────────────────────
// DRAG MODE
// ────────────────────────────────────────────
function toggleDragMode(tIdx) {
  dragModeActive[tIdx] = !dragModeActive[tIdx];
  const btn = document.getElementById(`drag-btn-${tIdx}`);
  const grid = document.getElementById(`grid-${tIdx}`);
  if (dragModeActive[tIdx]) {
    btn.classList.add('active-drag');
    btn.textContent = '✓ 完成移动';
    grid.classList.add('drag-mode');
    showToast('长按拖动多肉换位置');
  } else {
    btn.classList.remove('active-drag');
    btn.textContent = '↕ 移动';
    grid.classList.remove('drag-mode');
  }
}

// ────────────────────────────────────────────
// SORT
// ────────────────────────────────────────────
function toggleSort(tIdx) {
  sortByWater[tIdx] = !sortByWater[tIdx];
  const btn = document.getElementById(`sort-btn-${tIdx}`);
  if (sortByWater[tIdx]) {
    btn.classList.add('sort-active');
    btn.textContent = '🔢 自定义排序';
  } else {
    btn.classList.remove('sort-active');
    btn.textContent = '🕐 按浇水排序';
  }
  renderTray(tIdx);
}

// ────────────────────────────────────────────
// TABS
// ────────────────────────────────────────────
function switchTray(idx) {
  currentTray = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.tray-section').forEach((s, i) => s.classList.toggle('active', i === idx));
}

// ────────────────────────────────────────────
// WATER
// ────────────────────────────────────────────
async function recordWater(plantId) {
  const p = plants[plantId];
  if (!p) return;
  p.waterLog.push(Date.now());
  await dbPut('plants', p);
  renderTray(p.trayIdx);
}

function waterAll(tIdx) {
  pendingWaterAllTray = tIdx;
  const name = TRAY_NAMES[tIdx];
  document.getElementById('waterAllTitle').textContent = `${name}盆 一键浇水`;
  const alive = Object.values(plants).filter(p => p.trayIdx === tIdx && p.name !== null).length;
  document.getElementById('waterAllDesc').textContent = `将为 ${name}盆 全部 ${alive} 盆多肉记录浇水时间。`;
  openModal('waterAllModal');
}

async function confirmWaterAll() {
  closeModal('waterAllModal');
  const tIdx = pendingWaterAllTray;
  const now = Date.now();
  const trayPlants = Object.values(plants).filter(p => p.trayIdx === tIdx && p.name !== null);
  for (const p of trayPlants) {
    p.waterLog.push(now);
    await dbPut('plants', p);
  }
  renderTray(tIdx);
  showToast(`💧 ${TRAY_NAMES[tIdx]}盆 ${trayPlants.length} 盆已浇水`);
}

function waterSingle() {
  if (!detailPlantId) return;
  recordWater(detailPlantId).then(() => {
    renderDetailWaterLog();
    showToast('💧 已记录浇水');
  });
}

// ────────────────────────────────────────────
// DETAIL
// ────────────────────────────────────────────
function openDetail(plantId) {
  detailPlantId = plantId;
  const p = plants[plantId];
  document.getElementById('detail-name').textContent = p.name;
  document.getElementById('detail-pos').textContent = `${TRAY_NAMES[p.trayIdx]}盆 · 第 ${p.slot + 1} 位`;
  document.getElementById('detailView').classList.add('open');
  renderDetailWaterLog();
  renderDetailPhotos();
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('open');
  detailPlantId = null;
}

function renderDetailWaterLog() {
  const p = plants[detailPlantId];
  const el = document.getElementById('water-log-list');
  if (!p || !p.waterLog.length) {
    el.innerHTML = '<div class="water-log-empty">还没有浇水记录</div>';
    return;
  }
  const sorted = [...p.waterLog].sort((a, b) => b - a);
  el.innerHTML = sorted.map(ts => `
    <div class="water-log-item">
      <span class="water-log-icon">💧</span>
      <span class="water-log-date">${formatDate(ts)}</span>
    </div>
  `).join('');
}

async function renderDetailPhotos() {
  const el = document.getElementById('photo-log-list');
  el.innerHTML = '<div class="photo-log-empty">加载中…</div>';
  const photos = await dbGetByIndex('photos', 'plantId', detailPlantId);
  photos.sort((a, b) => b.timestamp - a.timestamp);
  if (!photos.length) {
    el.innerHTML = '<div class="photo-log-empty">还没有照片，点击上方📷拍照吧</div>';
    return;
  }
  el.innerHTML = photos.map(ph => `
    <div class="photo-log-item">
      <img class="photo-log-img" src="${ph.dataUrl}" loading="lazy">
      <div class="photo-log-meta">
        <span class="photo-log-date">${formatDate(ph.timestamp)}</span>
        <span class="photo-log-del" onclick="deletePhoto(${ph.id})">删除</span>
      </div>
    </div>
  `).join('');
}

async function deletePhoto(photoId) {
  const photo = await dbGet('photos', photoId);
  if (!photo) return;
  await dbDelete('photos', photoId);
  // Update latestPhotoId if needed
  const p = plants[photo.plantId];
  if (p && p.latestPhotoId === photoId) {
    const remaining = await dbGetByIndex('photos', 'plantId', photo.plantId);
    remaining.sort((a, b) => b.timestamp - a.timestamp);
    p.latestPhotoId = remaining.length ? remaining[0].id : null;
    await dbPut('plants', p);
    renderTray(p.trayIdx);
  }
  renderDetailPhotos();
  showToast('照片已删除');
}

// ────────────────────────────────────────────
// CAMERA
// ────────────────────────────────────────────
function triggerCamera() {
  document.getElementById('cameraInput').click();
}

document.getElementById('cameraInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file || !detailPlantId) return;
  e.target.value = '';

  const dataUrl = await cropToSquare(file);
  const photoId = await savePhoto(detailPlantId, dataUrl);

  // Update plant's latestPhotoId
  const p = plants[detailPlantId];
  p.latestPhotoId = photoId;
  await dbPut('plants', p);

  renderTray(p.trayIdx);
  renderDetailPhotos();
  showToast('📷 照片已保存');
});

function cropToSquare(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = Math.min(img.width, img.height);
        const canvas = document.createElement('canvas');
        canvas.width = 600; canvas.height = 600;
        const ctx = canvas.getContext('2d');
        const sx = (img.width - size) / 2;
        const sy = (img.height - size) / 2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, 600, 600);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function savePhoto(plantId, dataUrl) {
  const photo = { plantId, dataUrl, timestamp: Date.now() };
  return await dbPut('photos', photo);
}

// ────────────────────────────────────────────
// RENAME
// ────────────────────────────────────────────
function openRenameModal() {
  const p = plants[detailPlantId];
  document.getElementById('renameInput').value = p.name;
  openModal('renameModal');
  setTimeout(() => document.getElementById('renameInput').focus(), 300);
}

async function confirmRename() {
  const val = document.getElementById('renameInput').value.trim();
  if (!val) return;
  const p = plants[detailPlantId];
  p.name = val;
  await dbPut('plants', p);
  document.getElementById('detail-name').textContent = val;
  renderTray(p.trayIdx);
  closeModal('renameModal');
  showToast('名字已更新');
}

// ────────────────────────────────────────────
// REMOVE
// ────────────────────────────────────────────
function openRemoveConfirm() {
  openModal('removeModal');
}

async function confirmRemove() {
  closeModal('removeModal');
  const p = plants[detailPlantId];
  // Delete all photos
  await dbDeleteByIndex('photos', 'plantId', detailPlantId);
  // Reset plant (keep slot, tray, but null name)
  p.name = null;
  p.waterLog = [];
  p.latestPhotoId = null;
  await dbPut('plants', p);
  renderTray(p.trayIdx);
  closeDetail();
  showToast('多肉已移除');
}

// ────────────────────────────────────────────
// ADD (empty slot)
// ────────────────────────────────────────────
function openAddPlant(plantId) {
  detailPlantId = plantId;
  document.getElementById('renameInput').value = '';
  // Reuse rename modal as add modal
  document.querySelector('#renameModal .modal-title').textContent = '添加多肉名字';
  openModal('renameModal');
  setTimeout(() => document.getElementById('renameInput').focus(), 300);
}

// After confirmRename is called, if name was null before, it's now set
// We handle this in confirmRename already

// ────────────────────────────────────────────
// MODALS
// ────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  // Reset rename modal title
  if (id === 'renameModal') {
    document.querySelector('#renameModal .modal-title').textContent = '修改名字';
  }
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ────────────────────────────────────────────
// TOAST
// ────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────
function formatDate(ts) {
  const d = new Date(ts);
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return `${y}.${mo}.${day}  ${h}:${m}`;
}

// ────────────────────────────────────────────
// KEYBOARD (rename enter key)
// ────────────────────────────────────────────
document.getElementById('renameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') confirmRename();
});

// ────────────────────────────────────────────
// START
// ────────────────────────────────────────────
init();
</script>
